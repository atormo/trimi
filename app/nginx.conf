server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints these — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # No client-side routes today (the activation code lives in the URL
    # hash, which never reaches the server), but falling back to index.html
    # is harmless and future-proofs it.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
